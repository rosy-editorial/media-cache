name: RosyArts publisher

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: rosyarts-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        startsWith(github.event.issue.title, '[AUTO-PUBLISH]') &&
        contains(fromJSON('["rosy-editorial","StillFantastic"]'), github.event.issue.user.login)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Buffer connection
        id: buffer
        shell: bash
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {

          const token = process.env.BUFFER_API_KEY;
          if (!token) throw new Error('BUFFER_API_KEY is missing from GitHub Actions secrets.');

          async function bufferRequest(query, variables = {}) {
            const response = await fetch('https://api.buffer.com', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ query, variables }),
            });
            const result = await response.json();
            if (!response.ok || result.errors?.length) {
              throw new Error(result.errors?.[0]?.message || `Buffer HTTP ${response.status}`);
            }
            return result.data;
          }

          const accountData = await bufferRequest(`
            query GetOrganizations {
              account {
                organizations { id name }
              }
            }
          `);

          const organizations = accountData?.account?.organizations || [];
          if (!organizations.length) throw new Error('No Buffer organization was found.');

          let selected;
          for (const organization of organizations) {
            const channelData = await bufferRequest(`
              query GetChannels($input: ChannelsInput!) {
                channels(input: $input) {
                  id
                  name
                  service
                  timezone
                  isDisconnected
                  isLocked
                  isQueuePaused
                  postingSchedule { day paused times }
                }
              }
            `, { input: { organizationId: organization.id } });

            selected = (channelData.channels || []).find((channel) =>
              channel.service === 'instagram' &&
              channel.name.toLowerCase().replace(/^@/, '') === 'rosy.editorial'
            );
            if (selected) break;
          }

          if (!selected) throw new Error('Instagram channel rosy.editorial was not found in Buffer.');
          if (selected.isDisconnected) throw new Error('Instagram is disconnected in Buffer.');
          if (selected.isLocked) throw new Error('The Instagram channel is locked in Buffer.');
          if (selected.isQueuePaused) throw new Error('The Instagram queue is paused in Buffer.');

          fs.writeFileSync('/tmp/buffer-channel.json', JSON.stringify(selected));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `channel_id=${selected.id}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `channel_name=${selected.name}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `channel_timezone=${selected.timezone}\n`);
          console.log(`Connected to Instagram @${selected.name} (${selected.timezone}).`);
          console.log('Posting schedule:', JSON.stringify(selected.postingSchedule));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Install renderer
        if: github.event_name == 'issues'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock sharp@0.34.3

      - name: Render carousel images
        if: github.event_name == 'issues'
        id: render
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dns = require('node:dns').promises;
          const net = require('node:net');
          const path = require('node:path');
          const sharp = require('sharp');

          (async () => {

          const WIDTH = 1080;
          const HEIGHT = 1350;
          const ALLOWED_LAYOUTS = new Set([
            'top-left', 'top-right', 'center', 'bottom-left', 'bottom-right', 'image-only'
          ]);
          const ALLOWED_POSITIONS = new Set([
            'centre', 'center', 'north', 'south', 'east', 'west', 'northeast',
            'northwest', 'southeast', 'southwest', 'attention', 'entropy'
          ]);

          function fail(message) {
            throw new Error(`Invalid publishing request: ${message}`);
          }

          function escapeXml(value = '') {
            return String(value)
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;')
              .replaceAll("'", '&apos;');
          }

          function stripFence(raw) {
            const text = String(raw || '').trim();
            const match = text.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
            return match ? match[1] : text;
          }

          function isPrivateIp(address) {
            if (net.isIPv4(address)) {
              const parts = address.split('.').map(Number);
              return parts[0] === 10 ||
                parts[0] === 127 ||
                (parts[0] === 169 && parts[1] === 254) ||
                (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) ||
                (parts[0] === 192 && parts[1] === 168) ||
                parts[0] === 0;
            }
            const normalized = address.toLowerCase();
            return normalized === '::1' || normalized.startsWith('fc') ||
              normalized.startsWith('fd') || normalized.startsWith('fe8') ||
              normalized.startsWith('fe9') || normalized.startsWith('fea') ||
              normalized.startsWith('feb');
          }

          async function validateRemoteUrl(rawUrl) {
            let url;
            try {
              url = new URL(rawUrl);
            } catch {
              fail(`Invalid image URL: ${rawUrl}`);
            }
            if (url.protocol !== 'https:') fail('Every image URL must use HTTPS.');
            if (url.username || url.password) fail('Image URLs cannot contain credentials.');
            if (url.hostname === 'localhost' || url.hostname.endsWith('.local')) {
              fail('Local image URLs are not allowed.');
            }
            const addresses = await dns.lookup(url.hostname, { all: true });
            if (!addresses.length || addresses.some(({ address }) => isPrivateIp(address))) {
              fail(`Private or unresolved image host: ${url.hostname}`);
            }
            return url;
          }

          async function downloadImage(rawUrl) {
            const initialUrl = await validateRemoteUrl(rawUrl);
            const response = await fetch(initialUrl, {
              redirect: 'follow',
              headers: { 'User-Agent': 'RosyArts-Media-Renderer/1.0' },
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) fail(`Image download failed (${response.status}): ${initialUrl.hostname}`);
            await validateRemoteUrl(response.url);
            const statedSize = Number(response.headers.get('content-length') || 0);
            if (statedSize > 20 * 1024 * 1024) fail('An image exceeds the 20 MB limit.');
            const buffer = Buffer.from(await response.arrayBuffer());
            if (buffer.length > 20 * 1024 * 1024) fail('An image exceeds the 20 MB limit.');
            await sharp(buffer).metadata();
            return buffer;
          }

          function normalizedLines(value, maxLines, fieldName) {
            const lines = Array.isArray(value)
              ? value.map(String)
              : String(value || '').split('\n');
            const cleaned = lines.map((line) => line.trim()).filter(Boolean);
            if (cleaned.length > maxLines) fail(`${fieldName} has too many lines.`);
            if (cleaned.some((line) => line.length > 40)) {
              fail(`${fieldName} contains a line longer than 40 characters.`);
            }
            return cleaned;
          }

          function makeTextElements(lines, x, startY, fontSize, lineHeight, anchor, weight, color, opacity = 1) {
            return lines.map((line, index) =>
              `<text x="${x}" y="${startY + index * lineHeight}" ` +
              `text-anchor="${anchor}" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" ` +
              `font-size="${fontSize}" font-weight="${weight}" fill="${escapeXml(color)}" ` +
              `fill-opacity="${opacity}" filter="url(#shadow)">${escapeXml(line)}</text>`
            ).join('\n');
          }

          function makeOverlaySvg(slide, headlineLines, bodyLines) {
            const layout = slide.layout || 'bottom-left';
            if (layout === 'image-only') return null;

            const textColor = /^#[0-9a-f]{6}$/i.test(slide.textColor || '')
              ? slide.textColor
              : '#FFFFFF';
            const opacity = Math.min(0.85, Math.max(0.15, Number(slide.overlayOpacity ?? 0.55)));
            const isRight = layout.endsWith('right');
            const isCenter = layout === 'center';
            const isTop = layout.startsWith('top');
            const anchor = isCenter ? 'middle' : isRight ? 'end' : 'start';
            const x = isCenter ? WIDTH / 2 : isRight ? WIDTH - 72 : 72;

            const headlineSize = Math.min(96, Math.max(42, Number(slide.headlineSize || 72)));
            const headlineHeight = Math.round(headlineSize * 1.28);
            const bodySize = Math.min(46, Math.max(26, Number(slide.bodySize || 34)));
            const bodyHeight = Math.round(bodySize * 1.55);
            const totalHeight = headlineLines.length * headlineHeight +
              (bodyLines.length ? 36 + bodyLines.length * bodyHeight : 0);

            let startY;
            if (isCenter) startY = Math.round((HEIGHT - totalHeight) / 2 + headlineSize);
            else if (isTop) startY = 205;
            else startY = HEIGHT - 88 - totalHeight + headlineSize;

            const bodyStartY = startY + headlineLines.length * headlineHeight + 24;
            const gradient = isCenter
              ? `<rect width="1080" height="1350" fill="#000" fill-opacity="${opacity * 0.7}"/>`
              : isTop
                ? `<rect width="1080" height="850" fill="url(#topGradient)"/>`
                : `<rect y="500" width="1080" height="850" fill="url(#bottomGradient)"/>`;

            const category = escapeXml(String(slide.category || 'CULTURE').toUpperCase().slice(0, 24));
            const headlineSvg = makeTextElements(
              headlineLines, x, startY, headlineSize, headlineHeight, anchor, 600, textColor
            );
            const bodySvg = makeTextElements(
              bodyLines, x, bodyStartY, bodySize, bodyHeight, anchor, 400, textColor, 0.94
            );

            return Buffer.from(`
              <svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="topGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#000" stop-opacity="${opacity}"/>
                    <stop offset="1" stop-color="#000" stop-opacity="0"/>
                  </linearGradient>
                  <linearGradient id="bottomGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#000" stop-opacity="0"/>
                    <stop offset="1" stop-color="#000" stop-opacity="${opacity}"/>
                  </linearGradient>
                  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.34"/>
                  </filter>
                </defs>
                ${gradient}
                <g transform="translate(956 64) scale(0.78)" filter="url(#shadow)">
                  <path d="M28 23 C4 1,-5 31,23 45 C5 55,14 82,34 55 C36 42,35 31,28 23Z" fill="#F3A6BE"/>
                  <path d="M40 23 C64 1,73 31,45 45 C63 55,54 82,34 55 C32 42,33 31,40 23Z" fill="#8FC9CE"/>
                  <ellipse cx="34" cy="43" rx="4" ry="19" fill="#F4D36B"/>
                </g>
                <text x="938" y="91" text-anchor="end" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"
                  font-size="23" font-weight="500" letter-spacing="3" fill="${textColor}"
                  filter="url(#shadow)">${category}</text>
                ${headlineSvg}
                ${bodySvg}
              </svg>
            `);
          }

          let payload;
          try {
            payload = JSON.parse(stripFence(process.env.ISSUE_BODY));
          } catch (error) {
            fail(`The issue body is not valid JSON (${error.message}).`);
          }

          if (payload.version !== 1) fail('version must be 1.');
          if (payload.dryRun !== undefined && typeof payload.dryRun !== 'boolean') {
            fail('dryRun must be true or false.');
          }
          if (!Array.isArray(payload.posts) || payload.posts.length < 1 || payload.posts.length > 5) {
            fail('posts must contain between 1 and 5 posts.');
          }

          fs.mkdirSync('rendered', { recursive: true });
          const manifest = { posts: [] };

          for (let postIndex = 0; postIndex < payload.posts.length; postIndex++) {
            const post = payload.posts[postIndex];
            if (typeof post.caption !== 'string' || post.caption.length > 2200) {
              fail(`Post ${postIndex + 1} needs a caption of at most 2,200 characters.`);
            }
            if (!Array.isArray(post.slides) || post.slides.length < 1 || post.slides.length > 10) {
              fail(`Post ${postIndex + 1} must contain 1-10 slides.`);
            }

            const manifestPost = { caption: post.caption, slides: [] };
            for (let slideIndex = 0; slideIndex < post.slides.length; slideIndex++) {
              const slide = post.slides[slideIndex];
              const layout = slide.layout || 'bottom-left';
              if (!ALLOWED_LAYOUTS.has(layout)) fail(`Unsupported layout: ${layout}`);

              const headlineLines = normalizedLines(slide.headlineLines || slide.headline, 6, 'headline');
              const bodyLines = normalizedLines(slide.bodyLines || slide.body, 8, 'body');
              if (layout !== 'image-only' && !headlineLines.length && !bodyLines.length) {
                fail(`Post ${postIndex + 1}, slide ${slideIndex + 1} has no text.`);
              }

              let canvas;
              if (slide.imageUrl) {
                const image = await downloadImage(slide.imageUrl);
                const position = ALLOWED_POSITIONS.has(slide.position) ? slide.position : 'attention';
                canvas = sharp(image).resize(WIDTH, HEIGHT, { fit: 'cover', position });
              } else {
                const color = /^#[0-9a-f]{6}$/i.test(slide.backgroundColor || '')
                  ? slide.backgroundColor
                  : '#E9E4DB';
                canvas = sharp({ create: { width: WIDTH, height: HEIGHT, channels: 3, background: color } });
              }

              const overlay = makeOverlaySvg(slide, headlineLines, bodyLines);
              if (overlay) canvas = canvas.composite([{ input: overlay }]);

              const filename = `post-${String(postIndex + 1).padStart(2, '0')}-slide-${String(slideIndex + 1).padStart(2, '0')}.jpg`;
              const outputPath = path.join('rendered', filename);
              await canvas.jpeg({ quality: 91, chromaSubsampling: '4:4:4' }).toFile(outputPath);
              manifestPost.slides.push({
                filename,
                altText: String(slide.altText || headlineLines.join(' ') || `RosyArts slide ${slideIndex + 1}`).slice(0, 500),
              });
            }
            manifest.posts.push(manifestPost);
          }

          fs.writeFileSync('/tmp/render-manifest.json', JSON.stringify(manifest, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dry_run=${payload.dryRun === true}\n`);
          console.log(`Rendered ${manifest.posts.length} post(s).`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish stable media
        if: github.event_name == 'issues'
        id: media
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MEDIA_DATE="$(date -u +%F)"
          MEDIA_DIR="media/${MEDIA_DATE}/cache-${{ github.event.issue.number }}-${{ github.run_id }}"
          mkdir -p "$MEDIA_DIR"
          cp rendered/*.jpg "$MEDIA_DIR"/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MEDIA_DIR"
          git commit -m "Add publishing media for issue #${{ github.event.issue.number }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "path=$MEDIA_DIR" >> "$GITHUB_OUTPUT"

      - name: Add posts to Buffer queue
        if: github.event_name == 'issues' && steps.render.outputs.dry_run != 'true'
        shell: bash
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CHANNEL_ID: ${{ steps.buffer.outputs.channel_id }}
          MEDIA_PATH: ${{ steps.media.outputs.path }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {

          const token = process.env.BUFFER_API_KEY;
          const channelId = process.env.CHANNEL_ID;
          const repository = process.env.GITHUB_REPOSITORY;
          const mediaPath = process.env.MEDIA_PATH;
          const manifest = JSON.parse(fs.readFileSync('/tmp/render-manifest.json', 'utf8'));

          async function bufferRequest(query, variables = {}) {
            const response = await fetch('https://api.buffer.com', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ query, variables }),
            });
            const result = await response.json();
            if (!response.ok || result.errors?.length) {
              throw new Error(result.errors?.[0]?.message || `Buffer HTTP ${response.status}`);
            }
            return result.data;
          }

          async function waitUntilPublic(url) {
            for (let attempt = 1; attempt <= 8; attempt++) {
              const response = await fetch(url, {
                method: 'GET',
                redirect: 'follow',
                headers: { Range: 'bytes=0-0' },
              });
              const contentType = response.headers.get('content-type') || '';
              if (response.ok && contentType.startsWith('image/')) return;
              await new Promise((resolve) => setTimeout(resolve, attempt * 1500));
            }
            throw new Error(`Media did not become directly available: ${url}`);
          }

          const mutation = `
            mutation CreatePost($input: CreatePostInput!) {
              createPost(input: $input) {
                __typename
                ... on PostActionSuccess {
                  post { id dueAt status }
                }
                ... on MutationError { message }
              }
            }
          `;

          const results = [];
          for (const post of manifest.posts) {
            const slides = post.slides.map((slide) => ({
              ...slide,
              url: `https://raw.githubusercontent.com/${repository}/main/${mediaPath}/${slide.filename}`,
            }));
            for (const slide of slides) await waitUntilPublic(slide.url);

            const input = {
              channelId,
              text: post.caption,
              assets: slides.map((slide) => ({
                image: {
                  url: slide.url,
                  metadata: { altText: slide.altText },
                },
              })),
              aiAssisted: true,
              mode: 'addToQueue',
              needsApproval: false,
              saveToDraft: false,
              schedulingType: 'automatic',
              source: 'rosyarts-github-publisher',
              metadata: {
                instagram: {
                  type: 'post',
                  shouldShareToFeed: true,
                  isAiGenerated: false,
                },
              },
            };

            const data = await bufferRequest(mutation, { input });
            const result = data.createPost;
            if (!result?.post) throw new Error(result?.message || 'Buffer rejected the post.');
            results.push({ id: result.post.id, dueAt: result.post.dueAt, status: result.post.status });
            console.log(`Queued post ${result.post.id} for ${result.post.dueAt}.`);
          }

          fs.writeFileSync('/tmp/publish-results.json', JSON.stringify(results, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Confirm and close publishing request
        if: success() && github.event_name == 'issues' && steps.render.outputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const results = JSON.parse(fs.readFileSync('/tmp/publish-results.json', 'utf8'));
            const lines = results.map((result, index) =>
              `${index + 1}. Queued for ${result.dueAt} (Buffer post ${result.id})`
            );
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Added to the Instagram queue.\n\n${lines.join('\n')}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Confirm dry run and close request
        if: success() && github.event_name == 'issues' && steps.render.outputs.dry_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Dry run passed: Buffer connection, input validation, image rendering, and public media hosting all worked. No Instagram post was queued.',
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Report failure
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Automatic publishing stopped. Check the Buffer queue in case an earlier post was already added, then review the workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Remove media older than seven days
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          node <<'NODE' > /tmp/expired-tags.txt
          const fs = require('node:fs');
          const releases = JSON.parse(fs.readFileSync('/tmp/releases.json', 'utf8'));
          const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
          for (const release of releases) {
            if (release.tag_name?.startsWith('cache-') && Date.parse(release.created_at) < cutoff) {
              console.log(release.tag_name);
            }
          }
          NODE
          while IFS= read -r tag; do
            [ -z "$tag" ] || gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < /tmp/expired-tags.txt
